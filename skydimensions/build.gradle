plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.171'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        modSource project.sourceSets.main
    }

    client {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', mod_id
        programArgument '--nogui'
    }

    data {
        programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    mavenLocal()
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    // MelanX maven - hosts SkyblockBuilder and SkyGUIs releases
    // (de.melanx:SkyblockBuilder, de.melanx:SkyGUIs)
    maven {
        name = 'MelanX'
        url = 'https://maven.melanx.de/release'
    }
    // ModdingX maven - hosts LibX (org.moddingx:LibX)
    maven {
        name = 'ModdingX'
        url = 'https://maven.moddingx.org/release'
    }
    // ModMaven - additional mod deps
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    // CurseMaven fallback
    exclusiveContent {
        forRepository {
            maven { url 'https://cursemaven.com' }
        }
        filter {
            includeGroup 'curse.maven'
        }
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"

    // LibX - required by SkyblockBuilder for config, networking, etc.
    implementation "org.moddingx:LibX:${libx_version}"

    // Skyblock Builder - from MelanX maven (de.melanx:SkyblockBuilder:21.1.19)
    compileOnly "de.melanx:SkyblockBuilder:${skyblockbuilder_version}"
    runtimeOnly "de.melanx:SkyblockBuilder:${skyblockbuilder_version}"

    // Sky GUIs - optional, from MelanX maven (de.melanx:SkyGUIs:21.1.8)
    compileOnly "de.melanx:SkyGUIs:${skyguis_version}"
    runtimeOnly "de.melanx:SkyGUIs:${skyguis_version}"
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties + [project: project]
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven { url "file://${project.projectDir}/repo" }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
